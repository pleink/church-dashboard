name: Docker image

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: church-dashboard:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test production image
        shell: bash
        run: |
          docker run -d --name dashboard -p 5000:5000 \
            -e BASIC_AUTH_USER=ci -e BASIC_AUTH_PASS=smoke-test church-dashboard:test
          trap 'docker logs dashboard; docker rm -f dashboard' EXIT
          curl --fail --retry 15 --retry-connrefused --retry-delay 2 \
            --user ci:smoke-test http://localhost:5000/api/signage/labels
          curl --fail --user ci:smoke-test http://localhost:5000/ > /dev/null
      - name: Build and publish multi-platform image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
